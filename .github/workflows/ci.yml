name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: 检查发布标签与包版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: 安装开发依赖
        run: uv sync --locked --extra dev
      - name: Ruff 检查
        run: uv run --locked ruff check src/
      - name: Ruff 格式检查
        run: uv run --locked ruff format --check src/
      - name: Pyright 检查
        run: uv run --locked pyright src/
      - name: 测试
        run: uv run --locked pytest src/cade/tests -q --tb=short
      - name: 构建分发包
        run: uv build --no-sources
