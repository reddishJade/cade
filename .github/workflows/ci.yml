name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: 检查发布标签与包版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: 安装系统依赖
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: 安装开发依赖
        run: uv sync --locked --extra dev
      - name: Ruff 检查
        run: uv run --locked ruff check src/
      - name: Ruff 格式检查
        run: uv run --locked ruff format --check src/
      - name: Pyright 检查
        run: uv run --locked pyright src/
      - name: Tool / mode / permission 回归测试
        run: >
          uv run --locked pytest -q
          src/cade/tests/test_agent_execution.py
          src/cade/tests/test_tools_execution_modes.py
          src/cade/tests/test_security_permissions.py
          src/cade/tests/test_shell_policy.py
          src/cade/tests/test_approval_reviewer.py
          src/cade/tests/test_tools_apply_patch.py
          src/cade/tests/test_harness_tool_gate.py
          src/cade/tests/test_harness_contextual.py
          src/cade/tests/test_app_composition.py
          src/cade/tests/test_tools_subagent.py
          src/cade/tests/test_memory.py
          src/cade/tests/test_context_window.py
      - name: 命令行启动检查
        run: uv run --locked cade --help
      - name: 构建分发包
        run: uv build --no-sources
