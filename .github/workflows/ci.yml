name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.19"
          python-version: "3.12"
          enable-cache: true
      - name: Check release tag against package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install development dependencies
        run: uv sync --locked --extra dev
      - name: Ruff lint check
        run: uv run --locked ruff check src/
      - name: Ruff format check
        run: uv run --locked ruff format --check src/
      - name: Pyright type check
        run: uv run --locked pyright src/
      - name: Regression tests
        if: hashFiles('src/cade/tests/**/test_*.py') != ''
        run: uv run --locked pytest -q src/cade/tests
      - name: CLI startup check
        run: uv run --locked cade --help
      - name: Build distributions
        run: uv build --no-sources
